stages:
  - check-jenkins-status

check_jenkins_status:
  stage: check-jenkins-status
  script:
    - |
      # Define Jenkins parameters
      FORKED_REPO_URL=$CI_MERGE_REQUEST_SOURCE_PROJECT_URL
      FORKED_REPO_BRANCH=$CI_MERGE_REQUEST_SOURCE_BRANCH_NAME

      JENKINS_URL="https://prod.blsm.nvidia.com/metropolis-iva-tlt-jenkins/"
      
      # Step 1: Fetch the last build number before triggering a new build
      last_build_number=$(curl -s -X POST -u "$JENKINS_USER:$JENKINS_TOKEN" "$JENKINS_URL/job/tao-pytorch-develop/lastBuild/buildNumber")

      # Step 2: Trigger the new build
      curl -X POST -u "$JENKINS_USER:$JENKINS_TOKEN" \
      "$JENKINS_URL/view/tao-pytorch/job/tao-pytorch-develop/buildWithParameters?token=$JENKINS_JOB_TOKEN&GITLAB_BRANCH=$FORKED_REPO_BRANCH&GITLAB_REPO_URL=$FORKED_REPO_URL"

      # Step 3: Poll until a new build number is detected
      while true; do
          current_build_number=$(curl -s -X POST -u "$JENKINS_USER:$JENKINS_TOKEN" "$JENKINS_URL/job/tao-pytorch-develop/lastBuild/buildNumber")
          
          if [ "$current_build_number" -gt "$last_build_number" ]; then
              echo "New build detected: Build Number $current_build_number"
              break
          fi

          sleep 1
      done

      build_url="$JENKINS_URL/job/tao-pytorch-develop/${current_build_number}/"
      echo "You can view the build details at: $build_url"

      # STEP3 : Poll Jenkins job status and get details for each stage
      while true; do
          # Fetch job status and stage details
          response=$(curl -s -u "$JENKINS_USER:$JENKINS_TOKEN" \
          "$JENKINS_URL/job/tao-pytorch-develop/${current_build_number}/wfapi/describe")

          # Extract job status (SUCCESS, FAILURE, ABORTED, etc.)
          JOB_STATUS=$(curl -s -u "$JENKINS_USER:$JENKINS_TOKEN" \
          "$JENKINS_URL/job/tao-pytorch-develop/${current_build_number}/api/json" | jq -r '.result')

          # Check and display the current status of each stage
          echo ""
          echo "$response" | jq -r '.stages[] | "\(.name): \(.status)"'
          echo ""

          # Handle the overall job status
          if [ "$JOB_STATUS" == "SUCCESS" ]; then
              echo "Jenkins job succeeded"
              break
          elif [ "$JOB_STATUS" == "FAILURE" ]; then
              echo "Jenkins job failed"
              exit 1
          elif [ "$JOB_STATUS" == "ABORTED" ]; then
              echo "Jenkins job was aborted"
              exit 1
          else
              sleep 10
          fi
      done
  tags: ["trigger-jenkins"]
  only:
    refs:
      - merge_requests

