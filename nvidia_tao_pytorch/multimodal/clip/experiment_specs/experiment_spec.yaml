results_dir: ???
train:
  num_epochs: 100
  checkpoint_interval: 10
  resume_training_checkpoint_path: null
  grad_checkpointing: false
  grad_clip_norm: null
  precision: fp16
  pretrained_model_path: null
  loss_type: siglip  # siglip or clip
  optim:
    optimizer_type: adamw  # adamw, lamb, or sgd
    vision_lr: 1e-4
    text_lr: 1e-4
    betas: [0.9, 0.95]
    eps: 1e-06
    weight_decay: 1e-4
    warmup_steps: 100
  val_check_interval: 100

dataset:
  seed: 42
  train:
    type: custom  # custom, wds, or classification
    datasets:
    - root_dir: ???
      image_list_file: ???
      label_dir: ???
      label_suffix: .txt
    batch_size: 128
    num_workers: 8
  val:
    type: custom
    dataset:
      root_dir: ???
      image_list_file: ???
      label_dir: ???
      label_suffix: .txt
    batch_size: 64
    num_workers: 8
    split: val
    classnames_file: null
  augmentation:
    scale: [0.4, 1.0]
    color_jitter: [0.8, 0.32, 0.32, 0.32, 0.08]  # [prob, brightness, contrast, saturation, hue]
    grayscale: 0.2

model:
  type: ???  # ViT-L-14-SigLIP-CLIPA-224, c-radio_v3-h, siglip2-so400m, etc.

evaluate:
  checkpoint: ???
  batch_size: 32

inference:
  checkpoint: ???
  batch_size: 32
  image_dir: ???

export:
  checkpoint: ???
  onnx_file: ???
  encoder_type: combined  # vision, text, or combined
  input_height: 224
  input_width: 224
  batch_size: -1
  opset_version: 17
