encryption_key: tlt_encode
    
results_dir: /tao-pt/tao-experiments/result/nvdinov2
model:
  backbone: 
    type: "vit_l"
    drop_path_rate: 0.4
    patch_size: 14
    img_size: 518
  head:
    num_layers: 3
    hidden_dim: 2048
    bottleneck_dim: 384

dataset:
  train_dataset:
    images_dir: /tao-pt/tao-experiments/data/COCO2017/train2017
  batch_size: 16
  workers: 10

export:
  results_dir: "${results_dir}/export"
  gpu_id: 0
  checkpoint: /tao-pt/tao-experiments/result/nvdinov2/train/teacher_step_000000010.pth
  onnx_file: "${export.results_dir}/nvdinov2.onnx"
  input_width: 518
  input_height: 518
  batch_size: 16