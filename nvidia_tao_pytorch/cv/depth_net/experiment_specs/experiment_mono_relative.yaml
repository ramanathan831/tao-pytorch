results_dir: /results/relative_depth_anything/
dataset:
  dataset_name: MonoDataset
  train_dataset:
    data_sources:
      - dataset_name: Middlebury
        data_file: /data/datasets/Middlebury/test_clean.txt
    batch_size: 4
  val_dataset:
    data_sources:
      - dataset_name: Middlebury
        data_file: /data//datasets/Middlebury/test_clean.txt
    batch_size: 1
  test_dataset:
    data_sources:
      - dataset_name: Middlebury
        data_file: /data//datasets/Middlebury/test_clean.txt
    batch_size: 1
  infer_dataset:
    data_sources:
      - dataset_name: Middlebury
        data_file: /data/datasets/Middlebury/test_clean.txt
    batch_size: 10
train:
  vis_step_interval: 1000
  dataloader_visualize: True
  pretrained_model_path: /data/DepthFusion/models/dinov2_vitl14_pretrain.pth
  num_gpus: 1
  num_nodes: 1
  num_epochs: 10
  activation_checkpoint: False
  optim:
    lr: 0.000006
    lr_scheduler: LambdaLR
model:
  model_type: RelativeDepthAnything
  encoder: vitl
  use_bn: False
  use_clstoken: False
evaluate:
  num_gpus: 1
  checkpoint: /data/DepthFusion/models/nv_releative_depth_anything_v1.pth
inference:
  num_gpus: 1
  checkpoint: /data/DepthFusion/models/nv_releative_depth_anything_v1.pth
export:
  gpu_id: 0
  checkpoint: /results/relative_depth_anything/train/dn_model_latest.pth
  onnx_file: /results/relative_depth_anything/export/dn_model_latest.onnx
  input_channel: 3
  input_width: 924
  input_height: 518
