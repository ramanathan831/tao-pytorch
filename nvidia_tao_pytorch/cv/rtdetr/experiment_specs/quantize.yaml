results_dir: ???
wandb:
  enable: False

train:
  seed: 47
  resume_training_checkpoint_path: null
  num_epochs: 50
  num_nodes: 1
  num_gpus: 1
  gpu_ids: [0]
  validation_interval: 1
  checkpoint_interval: 1

model:
  backbone: resnet_50
  train_backbone: False
  return_interm_indices: [1, 2, 3]
  dec_layers: 6
  enc_layers: 1
  num_queries: 300

quantize:
  model_path: "???"
  results_dir: ${results_dir}
  backend: "torchao"
  mode: "static_ptq"
  algorithm: "minmax"
  default_layer_dtype: "native"
  default_activation_dtype: "native"
  layers:
    - module_name: "Linear"
      weights:
        dtype: "float8_e4m3fn"
      activations:
        dtype: "float8_e4m3fn"

dataset:
  # Validation set will be used for calibration
  val_data_sources:
    image_dir: "???"
    json_file: "???"
  num_classes: ??
  batch_size: 8
  workers: 8
  dataset_type: default
  remap_mscoco_category: True


