#   onnx_file: "${export.results_dir}/classifier.onnx"
#   input_width: 224
#   input_height: 224
#   batch_size: -1

# gen_trt_engine:
#   tensorrt:
#     data_type: FP32

model:
  backbone:
    # p1
    # type: "c_radio_p1_vit_huge_patch16_224_mlpnorm"
    # pretrained_backbone_path: /tao-pt/mount/pretrained_models/c_radio/c_radio_p1.pth
    # p2
    type: "c_radio_p2_vit_huge_patch16_224_mlpnorm"
    pretrained_backbone_path: /tao-pt/mount/pretrained_models/c_radio/c_radio_p2_siglip.pth
    # p3
    # type: "c_radio_p3_vit_huge_patch16_224_mlpnorm"
    # pretrained_backbone_path: /tao-pt/mount/pretrained_models/c_radio/c_radio_p3_dual-res_siglip.pth
    # pretrained_backbone_path: null
    freeze_backbone: True
  head:
    type: "TAOLinearClsHead"
    binary: False
    topk: [1, 5]
    loss:
      type: CrossEntropyLoss


dataset:
  dataset: "CLDataset"
  root_dir: /tao-pt/mount/data/imagenet2012
  batch_size: 128
  workers: 12
  num_classes: 1000
  img_size: 224
  augmentation:
    random_flip:
      vflip_probability: 0
      hflip_probability: 0.5
      enable: True
    random_rotate:
      rotate_probability: 0.5
      angle_list: [90, 180, 270]
      enable: False
    random_color:
      brightness: 0.4
      contrast: 0.4
      saturation: 0.4
      enable: True
    with_scale_random_crop:
      enable: False
    with_random_crop: True
    with_random_blur: False
  train:
    data_prefix: imagenet/train
  val:
    data_prefix: imagenet/val
  test:
    data_prefix: imagenet/val