encryption_key: tlt_encode
results_dir: /tao-pt/mount/result/classification_pl/imagenet/cradio_p2_
wandb:
  enable: False
train:
  ema: True
  ema_type: refusion
  seed: 47
  resume_training_checkpoint_path: null
  num_epochs: 25
  num_nodes: 1
  num_gpus: 8
  gpu_ids: [0, 1, 2, 3, 4, 5, 6, 7]
  # num_gpus: 1
  # gpu_ids: [0]
  validation_interval: 1
  checkpoint_interval: 10
  tensorboard:
    enabled: True
  optim:
    lr: 0.005
    optim: "adamw"
    # policy: "step"
    policy: "CosineAnnealingLR"
    weight_decay: 0.05

# evaluate:
#   checkpoint: /tao-pt/mount/result/classification_pl/imagenet/nvdino_pretrain_0103_freeze_lr_0.005_epoch20/train/classifier_model_latest.pth

