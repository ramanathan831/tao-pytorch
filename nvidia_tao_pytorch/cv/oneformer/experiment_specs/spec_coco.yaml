results_dir: nvidia_tao_pytorch/cv/oneformer/checkpoints/coco/swin

dataset:
  train:
    images: /workspace/datasets/coco/train2017
    annotations: /workspace/datasets/coco/annotations/panoptic_train2017.json
    panoptic: /workspace/datasets/coco/panoptic_train2017
    batch_size: 4
    num_workers: 4
  val:
    images: /workspace/datasets/coco/val2017
    annotations: /workspace/datasets/coco/annotations/panoptic_val2017.json
    panoptic: /workspace/datasets/coco/panoptic_val2017
    batch_size: 4
    num_workers: 4
  test:
    images: /workspace/datasets/coco/val2017
    annotations: /workspace/datasets/coco/annotations/panoptic_val2017.json
    panoptic: /workspace/datasets/coco/panoptic_val2017
    batch_size: 4
    num_workers: 4
  image_size: 1024
  label_map: /workspace/datasets/coco/label_map.json
  cutmix_prob: 0.0


model:
  backbone:  
    name: D2SwinTransformer
    freeze_at: 0
    swin:
      embed_dim: 192
      depths: [2, 2, 18, 2]
      num_heads: [6, 12, 24, 48]
      window_size: 12
      mlp_ratio: 4.0
      patch_size: 4
      patch_norm: true
      ape: false
      pretrain_img_size: 384
      qkv_bias: true
      qk_scale: null
      attn_drop_rate: 0.0
      drop_rate: 0.0
      drop_path_rate: 0.3
      out_features: [res2, res3, res4, res5]
      out_indices: [0, 1, 2, 3]
      use_checkpoint: false
  one_former:
    num_object_queries: 150
  sem_seg_head:
    num_classes: 133
  test:
    test_topk_per_image: 100
    object_mask_threshold: 0.8
  
train:
  num_epochs: 50
  num_gpus: 8
  num_nodes: 4
  pretrained_model: nvidia_tao_pytorch/cv/oneformer/checkpoints/coco/swin/oneformer_nvppnet_pretrained.pth
  pretrained_backbone: 
  precision: 16-mixed
  iters_per_epoch: 15000
  
evaluate: 
  checkpoint: nvidia_tao_pytorch/cv/oneformer/checkpoints/coco/swin/oneformer_nvppnet_pretrained.pth
  num_gpus: 1
  gpu_ids: [0]
  results_dir: nvidia_tao_pytorch/cv/oneformer/checkpoints/coco/swin/eval

inference:
  mode: semantic
  results_dir: nvidia_tao_pytorch/cv/oneformer/checkpoints/coco/swin/inference
  images_dir: /workspace/datasets/coco/val2017
  image_size: [1024, 1024]
  checkpoint: nvidia_tao_pytorch/cv/oneformer/checkpoints/coco/swin_base/train/model_epoch_004_step_18485.pth
