results_dir: nvidia_tao_pytorch/cv/oneformer/checkpoints/ade/swin

dataset:
  train:
    annotations: /workspace/datasets/ADEChallengeData2016/ade20k_panoptic_train.json
    images: /workspace/datasets/ADEChallengeData2016/images/training
    panoptic: /workspace/datasets/ADEChallengeData2016/ade20k_panoptic_train
    batch_size: 4
    num_workers: 4
  val:
    annotations: /workspace/datasets/ADEChallengeData2016/ade20k_panoptic_val.json
    images: /workspace/datasets/ADEChallengeData2016/images/validation
    panoptic: /workspace/datasets/ADEChallengeData2016/ade20k_panoptic_val
    batch_size: 4
    num_workers: 4
  test:
    annotations: /workspace/datasets/ADEChallengeData2016/ade20k_panoptic_val.json
    images: /workspace/datasets/ADEChallengeData2016/images/validation
    panoptic: /workspace/datasets/ADEChallengeData2016/ade20k_panoptic_val
    batch_size: 4
    num_workers: 4
  label_map: /workspace/datasets/coco/label_map.json
  image_size: 1024
  cutmix_prob: 0.0

model:
  backbone:
    name: D2SwinTransformer
    freeze_at: 0
    swin:
      embed_dim: 192
      depths: [2, 2, 18, 2]
      num_heads: [6, 12, 24, 48]
      window_size: 12
      mlp_ratio: 4.0
      patch_size: 4
      patch_norm: true
      ape: false
      pretrain_img_size: 384
      qkv_bias: true
      qk_scale: null
      attn_drop_rate: 0.0
      drop_rate: 0.0
      drop_path_rate: 0.3
      out_features: [res2, res3, res4, res5]
      out_indices: [0, 1, 2, 3]
      use_checkpoint: false
  one_former:
    num_object_queries: 250
  sem_seg_head:
    num_classes: 150

train:
  num_epochs: 100
  num_gpus: 8
  num_nodes: 1
  pretrained_model: nvidia_tao_pytorch/cv/oneformer/checkpoints/ade/swin/896x896_250_16_swin_l_oneformer_ade20k_160k.pth
  pretrained_backbone:
  precision: 16-mixed
  iters_per_epoch: 15000
